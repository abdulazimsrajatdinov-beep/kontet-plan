<!doctype html>
<html lang="kaa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing planlar</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef;--card:#fff;--ink:#1d1d1f;--muted:#6b6b72;--line:#e6e2d9;
  --edu:#e8892b;--edu-soft:#fdf0e2;--sch:#d6457a;--sch-soft:#fbe6ee;
  --ok:#2f9e6a;--danger:#c93b3b;--shadow:0 6px 22px rgba(30,25,15,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:15px}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 80px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
header.top h1{margin:0;font-size:22px;font-weight:800}
.sync{font-size:12px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.tab{border:2px solid transparent;border-radius:18px;padding:16px;background:var(--card);box-shadow:var(--shadow);text-align:left;display:flex;align-items:center;gap:12px}
.tab .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff}
.tab b{display:block;font-size:16px}.tab small{color:var(--muted)}
.tab.edu .ic{background:var(--edu)}.tab.sch .ic{background:var(--sch)}
.tab.edu.on{border-color:var(--edu);background:var(--edu-soft)}
.tab.sch.on{border-color:var(--sch);background:var(--sch-soft)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.bar h2{margin:0;font-size:18px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--ink);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid #f0caca}
.accent{background:var(--a)!important}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pcard{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);border-top:4px solid var(--a);cursor:pointer}
.pcard h3{margin:0 0 6px;font-size:16px}
.pcard .meta{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.prog{height:7px;background:#eee;border-radius:9px;margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--a)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--card);border-radius:16px}
.editor{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px}
.ehead{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.title-in{width:100%;border:0;font-size:22px;font-weight:800;padding:6px 0;background:transparent;outline:none;border-bottom:2px dashed var(--line)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
label.f input,label.f select,textarea{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;color:var(--ink);font-size:15px;font-weight:500}
textarea{width:100%;min-height:80px;resize:vertical}
section.s{margin-top:22px}
section.s h4{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
table{width:100%;border-collapse:collapse}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700}
td input{width:100%;border:1px solid transparent;border-radius:8px;padding:6px;background:transparent}
td input:focus{border-color:var(--line);background:#fff;outline:none}
.x{border:0;background:transparent;color:#b5b0a6;font-size:18px;line-height:1;padding:4px 6px}
.x:hover{color:var(--danger)}
.month{margin-bottom:12px;border:1.5px solid var(--line);border-radius:12px;padding:10px}
.month-h{display:flex;gap:8px;align-items:center}
.month-h input{flex:1;border:0;font-weight:700;font-size:15px;padding:4px;outline:none;background:transparent}
.task{display:flex;gap:8px;align-items:center;padding:4px 0}
.task input[type=text]{flex:1;border:0;padding:5px;border-radius:8px;outline:none;background:transparent}
.task input[type=text]:focus{background:#faf8f3}
.task.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.task input[type=checkbox]{width:18px;height:18px;accent-color:var(--a)}
.pin{min-height:100vh;display:grid;place-items:center;padding:16px}
.pinbox{background:var(--card);padding:28px;border-radius:20px;box-shadow:var(--shadow);width:100%;max-width:340px;text-align:center}
.pinbox input{width:100%;font-size:26px;letter-spacing:8px;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:14px 0}
.err{color:var(--danger);font-size:13px;min-height:18px}
.hide{display:none!important}
@media (max-width:640px){
  .grid3{grid-template-columns:1fr}
  .tab{padding:12px}.tab .ic{width:36px;height:36px}
  .hide-m{display:none}
}
</style>
</head>
<body>

<div id="pinView" class="pin">
  <div class="pinbox">
    <h2 style="margin:0">Marketing planlar</h2>
    <p style="color:var(--muted);margin:6px 0 0">PIN kodtı kirgiziń</p>
    <input id="pinIn" type="password" inputmode="numeric" maxlength="12" autocomplete="off">
    <div class="err" id="pinErr"></div>
    <button class="btn" style="width:100%" id="pinBtn">Kiriw</button>
  </div>
</div>

<div id="app" class="wrap hide">
  <header class="top">
    <h1>Marketing planlar</h1>
    <span class="sync" id="sync"></span>
  </header>

  <div class="tabs">
    <button class="tab edu" data-org="edu"><span class="ic">E</span><span><b>Real Education</b><small id="cnt-edu">—</small></span></button>
    <button class="tab sch" data-org="sch"><span class="ic">S</span><span><b>Real School</b><small id="cnt-sch">—</small></span></button>
  </div>

  <div id="listView">
    <div class="bar">
      <h2 id="listTitle"></h2>
      <button class="btn accent" id="newBtn">+ Jańa plan</button>
    </div>
    <div id="list" class="list"></div>
  </div>

  <div id="editView" class="hide">
    <div class="bar">
      <button class="btn ghost small" id="backBtn">← Artqa</button>
      <span class="sync" id="saveState"></span>
    </div>
    <div class="editor" id="editor"></div>
  </div>
</div>

<script>
const SB_URL = "https://rgqruifzceraivheepdv.supabase.co";
const SB_KEY = "sb_publishable_gBRWWzLrDY4KDpgPtlk2sg_sTFOxECS";
const ORGS = {
  edu:{name:"Real Education", color:"var(--edu)", branches:["Nókis","Bumer","Shımbay","Ramada (jańa filial)","Barlıq filiallar"]},
  sch:{name:"Real School", color:"var(--sch)", branches:[]}
};
let PIN = null, plans = [], org = "sch", cur = null, saveTimer = null;

function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null}}
function forget(k){try{localStorage.removeItem(k)}catch(e){}}

async function rpc(fn, args){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{
    method:"POST",
    headers:{"apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json"},
    body:JSON.stringify(args)
  });
  const t = await r.text();
  if(!r.ok){ const e = new Error(t); e.bad = t.includes("bad_pin"); throw e; }
  return t ? JSON.parse(t) : null;
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- PIN ---------- */
async function tryPin(p){
  try{ const rows = await rpc("mp_list",{p_pin:p}); PIN = p; store("mp_pin",p); return rows; }
  catch(e){ if(e.bad) return null; throw e; }
}
async function login(p){
  document.getElementById("pinErr").textContent = "";
  try{
    const rows = await tryPin(p);
    if(!rows){ forget("mp_pin"); document.getElementById("pinErr").textContent = "PIN qáte"; return; }
    plans = rows;
    document.getElementById("pinView").classList.add("hide");
    document.getElementById("app").classList.remove("hide");
    setOrg(store("mp_org") || "sch");
  }catch(e){ document.getElementById("pinErr").textContent = "Baylanıs joq, qayta urınıń"; }
}
document.getElementById("pinBtn").onclick = () => login(document.getElementById("pinIn").value.trim());
document.getElementById("pinIn").onkeydown = e => { if(e.key==="Enter") login(e.target.value.trim()); };

/* ---------- LIST ---------- */
function progress(p){
  const t = (p.months||[]).flatMap(m => m.tasks||[]);
  return t.length ? Math.round(100 * t.filter(x=>x.done).length / t.length) : 0;
}
function setOrg(o){
  org = o; store("mp_org", o);
  document.documentElement.style.setProperty("--a", ORGS[o].color);
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.org===o));
  showList();
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => setOrg(b.dataset.org));

function showList(){
  cur = null;
  document.getElementById("editView").classList.add("hide");
  document.getElementById("listView").classList.remove("hide");
  document.getElementById("listTitle").textContent = ORGS[org].name + " planları";
  ["edu","sch"].forEach(o => {
    const n = plans.filter(p=>p.org===o).length;
    document.getElementById("cnt-"+o).textContent = n + " plan";
  });
  const mine = plans.filter(p => p.org===org);
  const list = document.getElementById("list");
  if(!mine.length){ list.innerHTML = `<div class="empty">Ele plan joq. «+ Jańa plan» túymesin basıń.</div>`; return; }
  list.innerHTML = mine.map(p => {
    const pr = progress(p);
    return `<div class="pcard" data-id="${esc(p.id)}">
      <h3>${esc(p.title||"Atı joq plan")}</h3>
      <div class="meta">${p.branch?`<span>${esc(p.branch)}</span>`:""}<span>${esc(p.period||"Múddet kórsetilmegen")}</span>${p.budget?`<span>${esc(p.budget)}</span>`:""}</div>
      <div class="prog"><i style="width:${pr}%"></i></div>
      <div class="meta" style="margin-top:6px"><span>Orınlandı: ${pr}%</span></div>
    </div>`;
  }).join("");
  list.querySelectorAll(".pcard").forEach(c => c.onclick = () => openPlan(c.dataset.id));
}

document.getElementById("newBtn").onclick = () => {
  const p = {id:uid(), org, title:"Jańa marketing plan", branch: ORGS[org].branches[0]||"", period:"", budget:"", goal:"",
    channels:[{name:"",budget:"",why:""}],
    months:[{name:"1-ay",tasks:[{text:"",done:false}]}],
    kpis:[{name:"Leadlar",target:"",now:""},{name:"Jańa oqıwshılar",target:"",now:""}],
    notes:""};
  plans.unshift(p); save(p, true); openPlan(p.id);
};
document.getElementById("backBtn").onclick = () => { flush(); showList(); };

/* ---------- EDITOR ---------- */
function openPlan(id){
  cur = plans.find(p=>p.id===id); if(!cur) return;
  document.getElementById("listView").classList.add("hide");
  document.getElementById("editView").classList.remove("hide");
  document.getElementById("saveState").textContent = "";
  render();
  window.scrollTo(0,0);
}

function render(){
  const p = cur, br = ORGS[p.org].branches;
  const ed = document.getElementById("editor");
  ed.innerHTML = `
    <div class="ehead">
      <input class="title-in" data-k="title" value="${esc(p.title)}">
    </div>
    <div class="grid3">
      ${br.length?`<label class="f">Filial<select data-k="branch">${br.map(b=>`<option ${b===p.branch?"selected":""}>${esc(b)}</option>`).join("")}</select></label>`:""}
      <label class="f">Múddet<input data-k="period" value="${esc(p.period)}" placeholder="mıs.: Noyabr 2026 – Yanvar 2027"></label>
      <label class="f">Byudjet<input data-k="budget" value="${esc(p.budget)}" placeholder="mıs.: 250 $ / ay"></label>
    </div>
    <label class="f">Maqset<textarea data-k="goal" placeholder="Bul plan neni beriwi kerek?">${esc(p.goal)}</textarea></label>

    <section class="s"><h4>Kanallar hám byudjet <button class="btn ghost small" data-add="channels">+ qatar</button></h4>
      <table><tr><th>Kanal</th><th style="width:22%">Byudjet</th><th class="hide-m">Ne ushın</th><th style="width:30px"></th></tr>
      ${p.channels.map((c,i)=>`<tr>
        <td><input data-arr="channels" data-i="${i}" data-f="name" value="${esc(c.name)}"></td>
        <td><input data-arr="channels" data-i="${i}" data-f="budget" value="${esc(c.budget)}"></td>
        <td class="hide-m"><input data-arr="channels" data-i="${i}" data-f="why" value="${esc(c.why)}"></td>
        <td><button class="x" data-del="channels" data-i="${i}" title="Óshiriw">×</button></td></tr>`).join("")}
      </table>
    </section>

    <section class="s"><h4>Jumıs rejesi <button class="btn ghost small" id="addMonth">+ ay / basqısh</button></h4>
      ${p.months.map((m,mi)=>`<div class="month">
        <div class="month-h"><input data-month="${mi}" value="${esc(m.name)}"><button class="x" data-delmonth="${mi}" title="Óshiriw">×</button></div>
        ${m.tasks.map((t,ti)=>`<div class="task ${t.done?"done":""}">
          <input type="checkbox" data-chk="${mi}:${ti}" ${t.done?"checked":""}>
          <input type="text" data-task="${mi}:${ti}" value="${esc(t.text)}" placeholder="Wazıypa…">
          <button class="x" data-deltask="${mi}:${ti}">×</button></div>`).join("")}
        <button class="btn ghost small" data-addtask="${mi}" style="margin-top:6px">+ wazıypa</button>
      </div>`).join("")}
    </section>

    <section class="s"><h4>KPI <button class="btn ghost small" data-add="kpis">+ qatar</button></h4>
      <table><tr><th>Kórsetkish</th><th style="width:22%">Maqset</th><th style="width:22%">Házir</th><th style="width:30px"></th></tr>
      ${p.kpis.map((c,i)=>`<tr>
        <td><input data-arr="kpis" data-i="${i}" data-f="name" value="${esc(c.name)}"></td>
        <td><input data-arr="kpis" data-i="${i}" data-f="target" value="${esc(c.target)}"></td>
        <td><input data-arr="kpis" data-i="${i}" data-f="now" value="${esc(c.now)}"></td>
        <td><button class="x" data-del="kpis" data-i="${i}">×</button></td></tr>`).join("")}
      </table>
    </section>

    <section class="s"><h4>Eskertpeler</h4>
      <textarea data-k="notes" placeholder="Ashıq sorawlar, ideyalar…">${esc(p.notes)}</textarea>
    </section>

    <div style="display:flex;justify-content:flex-end;margin-top:22px">
      <button class="btn danger small" id="delPlan">Plandı óshiriw</button>
    </div>`;

  ed.querySelectorAll("[data-k]").forEach(el => el.oninput = () => { p[el.dataset.k] = el.value; queue(); });
  ed.querySelectorAll("[data-arr]").forEach(el => el.oninput = () => { p[el.dataset.arr][+el.dataset.i][el.dataset.f] = el.value; queue(); });
  ed.querySelectorAll("[data-add]").forEach(el => el.onclick = () => {
    p[el.dataset.add].push(el.dataset.add==="kpis"?{name:"",target:"",now:""}:{name:"",budget:"",why:""}); queue(); render(); });
  ed.querySelectorAll("[data-del]").forEach(el => el.onclick = () => { p[el.dataset.del].splice(+el.dataset.i,1); queue(); render(); });
  ed.querySelectorAll("[data-month]").forEach(el => el.oninput = () => { p.months[+el.dataset.month].name = el.value; queue(); });
  ed.querySelectorAll("[data-delmonth]").forEach(el => el.onclick = () => {
    if(confirm("Bul bólimdi wazıypaları menen óshiriw kerek pe?")){ p.months.splice(+el.dataset.delmonth,1); queue(); render(); } });
  ed.querySelectorAll("[data-task]").forEach(el => el.oninput = () => { const [a,b]=el.dataset.task.split(":"); p.months[a].tasks[b].text = el.value; queue(); });
  ed.querySelectorAll("[data-chk]").forEach(el => el.onchange = () => { const [a,b]=el.dataset.chk.split(":"); p.months[a].tasks[b].done = el.checked; el.parentNode.classList.toggle("done", el.checked); queue(); });
  ed.querySelectorAll("[data-deltask]").forEach(el => el.onclick = () => { const [a,b]=el.dataset.deltask.split(":"); p.months[a].tasks.splice(b,1); queue(); render(); });
  ed.querySelectorAll("[data-addtask]").forEach(el => el.onclick = () => { p.months[+el.dataset.addtask].tasks.push({text:"",done:false}); queue(); render();
    const all = ed.querySelectorAll(`[data-task^="${el.dataset.addtask}:"]`); all[all.length-1]?.focus(); });
  document.getElementById("addMonth").onclick = () => { p.months.push({name:"Jańa bólim",tasks:[{text:"",done:false}]}); queue(); render(); };
  document.getElementById("delPlan").onclick = async () => {
    if(!confirm("Bul plan tolıq óshiriledi. Dawam etemiz be?")) return;
    clearTimeout(saveTimer);
    try{ await rpc("mp_delete",{p_pin:PIN,p_id:p.id}); plans = plans.filter(x=>x.id!==p.id); showList(); }
    catch(e){ alert("Óshiriw ámelge aspadı, internetti tekseriń."); }
  };
}

/* ---------- SAVE ---------- */
function queue(){ document.getElementById("saveState").textContent = "Saqlanıp atır…"; clearTimeout(saveTimer); saveTimer = setTimeout(()=>save(cur), 700); }
function flush(){ if(saveTimer && cur){ clearTimeout(saveTimer); save(cur); } }
async function save(p, quiet){
  saveTimer = null;
  const {id, updated_at, ...data} = p;
  try{ await rpc("mp_save",{p_pin:PIN,p_id:id,p_data:data}); if(!quiet) document.getElementById("saveState").textContent = "Saqlandı ✓"; }
  catch(e){ document.getElementById("saveState").textContent = "Saqlanbadı — internetti tekseriń"; }
}
window.addEventListener("beforeunload", flush);

/* ---------- START ---------- */
const saved = store("mp_pin");
if(saved) login(saved);
</script>
</body>
</html>
